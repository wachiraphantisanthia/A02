<!DOCTYPE html>
<html>

<head>
<title>Adopt Me</title>

<style>

body{
font-family: Arial;
background:#f5f5f5;
}

form{
background:white;
width:500px;
margin:auto;
padding:25px;
border-radius:8px;
}

h3{
color:#3b5773;
}

input, select, textarea{
width:100%;
padding:8px;
margin:8px 0;
}

.radio-group{
margin-top:5px;
}

.radio-item{
display:flex;
align-items:center;
gap:10px;
margin:6px 0;
}

.radio-item input{
width:auto;
}

.check{
display:flex;
align-items:flex-start;
gap:10px;
margin-top:15px;
color:#3b5773;
}

.check input{
width:auto;
margin-top:4px;
}

.required{
color:red;
}

.footer{
text-align:center;
margin-top:20px;
}

button{
padding:10px 20px;
background:#3498db;
color:white;
border:none;
cursor:pointer;
}

</style>

</head>
<div id="successBox" style="
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
text-align:center;
font-size:20px;
">

✅ Form submitted successfully!

</div>
<body>

<h2 style="text-align:center;">Pet Adoption Form</h2>

<form onsubmit="return validateForm()">

<h3>Personal Information</h3>

<label>Full Name</label>
<input type="text" id="fullname">

<label>Phone Number</label>
<input type="tel" id="phone">

<label>Email</label>
<input type="email">

<label>Address</label>
<textarea rows="3"></textarea>

<h3>House Type</h3>

<select>
<option>House with Garden</option>
<option>Single House</option>
<option>Townhome</option>
<option>Condo / Apartment</option>
</select>

<h3>Dog Living Area</h3>

<div class="radio-group">

<label class="radio-item">
<input type="radio" name="place">
<span>Inside House</span>
</label>

<label class="radio-item">
<input type="radio" name="place">
<span>Outside House</span>
</label>

</div>

<h3>Number of Pets You Currently Have <span class="required">*</span></h3>

<input type="number" id="pets" min="0" max="100">

<h3>Pet-Care Experience <span class="required">*</span></h3>

<div class="radio-group">

<label class="radio-item">
<input type="radio" name="experience">
<span>First-time pet owner</span>
</label>

<label class="radio-item">
<input type="radio" name="experience">
<span>Have owned pets before</span>
</label>

<label class="radio-item">
<input type="radio" name="experience">
<span>Experienced with multiple pets</span>
</label>

<label class="radio-item">
<input type="radio" name="experience">
<span>Professional/trained in pet care</span>
</label>

</div>

<h3>Number of Dogs You Want to Adopt <span class="required">*</span></h3>

<input type="number" id="dogs" min="0" max="100">

<label class="check">

<input type="checkbox" id="agree">

<span>
I understand and agree that submitting this application does not guarantee adoption approval.
The adoption center reserves the right to review all applications and select the most suitable homes for our dogs.
</span>

</label>

<br>

<button type="submit">Submit</button>

</form>

<div class="footer">
Student ID: 6833239121 <br>
Name: Wachiraphan Tisanthia
</div>

<script src="adoptme.js"></script>

</body>
</html>
